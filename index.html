<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Operational Performance</title>
<style>
:root {--text:#19314f;--line:#e1e8f1;--accent:#124c7c;--bg:#f3f6fa}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--text);background:var(--bg)}
.app{width:100%;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.appbar{display:flex;align-items:center;justify-content:flex-start;flex:0 0 52px;min-height:52px;padding:0 18px;background:#fff;border-bottom:1px solid var(--line)}
.tabs{height:100%;display:flex;align-items:stretch;gap:8px}
.tab{position:relative;border:0;background:transparent;color:#66788f;padding:0 22px;font:700 13px Inter,"Segoe UI",Arial,sans-serif;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.tab:hover{background:#f2f6fb;color:#244c77}
.tab[aria-selected="true"]{color:var(--accent);background:#edf5fc}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:15px;right:15px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:#1a779b}
.tab:focus-visible{outline:2px solid #2589bd;outline-offset:-4px}
.content{flex:1;min-height:0;position:relative;width:100%;display:flex;align-items:flex-start;justify-content:center;overflow:hidden;background:var(--bg)}
.stage{position:relative;flex:0 0 auto;overflow:hidden}
.dashboard-frame{display:block;position:absolute;top:0;left:0;border:0;background:var(--bg);transform-origin:top left}
.dashboard-frame[hidden]{display:none}
@media(max-width:540px){.appbar{padding:0 9px;flex-basis:48px;min-height:48px}.tabs{gap:2px;width:100%}.tab{flex:1;min-width:0;padding:0 5px;font-size:12px}.tab[aria-selected="true"]::after{left:8px;right:8px}}
</style>
</head>
<body>
<div class="app">
 <header class="appbar">
  <nav class="tabs" role="tablist" aria-label="Operational Performance">
   <button id="fleet-tab" class="tab" role="tab" type="button" aria-selected="true" aria-controls="fleet-panel" tabindex="0" data-dashboard="fleet">Fleet Performance</button>
   <button id="driver-tab" class="tab" role="tab" type="button" aria-selected="false" aria-controls="driver-panel" tabindex="-1" data-dashboard="driver">Driver Performance</button>
  </nav>
 </header>
 <main class="content" id="dashboard-content">
  <div class="stage" id="dashboard-stage">
   <iframe id="fleet-panel" class="dashboard-frame" role="tabpanel" aria-labelledby="fleet-tab" title="Fleet Performance" loading="eager"></iframe>
   <iframe id="driver-panel" class="dashboard-frame" role="tabpanel" aria-labelledby="driver-tab" title="Driver Performance" loading="eager" hidden></iframe>
  </div>
 </main>
 <noscript>JavaScript is required to display these dashboards.</noscript>
</div>

const frames={fleet:document.getElementById('fleet-panel'),driver:document.getElementById('driver-panel')};
const stage=document.getElementById('dashboard-stage');
const content=document.getElementById('dashboard-content');
const tabs=[...document.querySelectorAll('[data-dashboard]')];
const loaded={fleet:false,driver:false};
let selectedDashboard='fleet';
function fitStage(){
 const area=content.getBoundingClientRect();
 let width,height,scale;
 if(selectedDashboard==='fleet'){
   // Native viewport size on normal screens. Only short screens use modest
   // proportional downscaling to keep all three chart rows legible.
   scale=Math.min(1,area.height/915);
   width=area.width/scale;
   height=area.height/scale;
 } else {
   // Preserve the original chart proportions while fitting BOTH dimensions.
   // The iframe itself fills the entire available stage, so there are no
   // unused horizontal margins at wider or taller aspect ratios.
   scale=Math.min(1,area.width/1920,area.height/1028);
   width=area.width/scale;
   height=area.height/scale;
 }
 stage.style.width=(width*scale)+'px';
 stage.style.height=(height*scale)+'px';
 const frame=frames[selectedDashboard];
 frame.style.width=width+'px';
 frame.style.height=height+'px';
 frame.style.transform=scale===1?'none':'scale('+scale+')';
}
window.addEventListener('resize',fitStage);
function loadDashboard(name){
 if(loaded[name])return;
 const bytes=Uint8Array.from(atob(sourceDocuments[name]),c=>c.charCodeAt(0));
 frames[name].srcdoc=new TextDecoder('utf-8').decode(bytes);
 loaded[name]=true;
}
function selectDashboard(name,focus=false){
 if(!frames[name])return;
 selectedDashboard=name;
 loadDashboard(name);
 for(const tab of tabs){
  const chosen=tab.dataset.dashboard===name;
  tab.setAttribute('aria-selected',String(chosen));
  tab.tabIndex=chosen?0:-1;
  if(chosen&&focus)tab.focus();
 }
 for(const [key,frame] of Object.entries(frames))frame.hidden=key!==name;
 fitStage();
}
tabs.forEach((tab,index)=>{
 tab.addEventListener('click',()=>selectDashboard(tab.dataset.dashboard));
 tab.addEventListener('keydown',event=>{
  let next;
  if(event.key==='ArrowRight')next=(index+1)%tabs.length;
  else if(event.key==='ArrowLeft')next=(index+tabs.length-1)%tabs.length;
  else if(event.key==='Home')next=0;
  else if(event.key==='End')next=tabs.length-1;
  else return;
  event.preventDefault();selectDashboard(tabs[next].dataset.dashboard,true);
 });
});
selectDashboard('fleet');
</script>
</body>
